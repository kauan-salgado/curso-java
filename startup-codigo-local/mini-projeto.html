<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-projeto | Card do Bootstrap + JavaScript</title>

    <!-- Requisito 1: CSS do Bootstrap via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

    <!-- d-flex + justify-content-center + align-items-center: centraliza o card na tela -->
    <main class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">

        <h1 class="h3 fw-bold text-center mb-4">Mini-projeto: Card + JavaScript</h1>

        <!-- Requisito 2: Card do Bootstrap com imagem, título e botão -->
        <div class="card shadow-sm bg-white" id="card-plano" style="max-width: 360px;">
            <img src="img/logo.svg" class="card-img-top img-fluid p-5 bg-body-tertiary" alt="Logo da Código Local">
            <div class="card-body text-center">
                <h2 class="card-title h4 fw-bold" id="card-titulo">Plano Básico</h2>
                <p class="card-text" id="card-texto">R$ 49/mês: site de uma página, hospedagem e botão de WhatsApp.</p>
                <button type="button" class="btn btn-primary" id="botao-trocar">Ver plano Completo</button>
            </div>
        </div>

        <p class="text-body-secondary small mt-4 mb-0">Clique no botão para trocar o texto e a cor do card.</p>
    </main>

    <!-- Requisito 1: JavaScript do Bootstrap via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Requisito 3: addEventListener no botão que muda o texto E a cor de fundo do card -->
    <script>
        // 1) Seleciona os elementos do DOM
        const card = document.getElementById('card-plano');
        const titulo = document.getElementById('card-titulo');
        const texto = document.getElementById('card-texto');
        const botao = document.getElementById('botao-trocar');

        // 2) Variável que guarda qual plano está aparecendo
        let mostrandoCompleto = false;

        // 3) Ouvinte de evento: roda a função toda vez que o botão é clicado
        botao.addEventListener('click', () => {
            mostrandoCompleto = !mostrandoCompleto; // inverte: true <-> false

            if (mostrandoCompleto) {
                // Muda o conteúdo
                titulo.textContent = 'Plano Completo';
                texto.textContent = 'R$ 99/mês: cardápio online, galeria de fotos e alterações ilimitadas.';
                botao.textContent = 'Voltar ao plano Básico';

                // Muda as classes de cor do Bootstrap
                card.classList.replace('bg-white', 'bg-success');
                card.classList.add('text-white');
                botao.classList.replace('btn-primary', 'btn-light');
            } else {
                titulo.textContent = 'Plano Básico';
                texto.textContent = 'R$ 49/mês: site de uma página, hospedagem e botão de WhatsApp.';
                botao.textContent = 'Ver plano Completo';

                card.classList.replace('bg-success', 'bg-white');
                card.classList.remove('text-white');
                botao.classList.replace('btn-light', 'btn-primary');
            }
        });
    </script>
</body>
</html>
